<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amadeus;Movies</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Raleway', sans-serif;
    background: #080808;
    color: #e8e4de;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .display-font { font-family: 'Montserrat', serif; }

  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,170,100,0.13) 0%, transparent 65%),
      radial-gradient(ellipse 40% 40% at 85% 60%, rgba(150,80,40,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 30% 50% at 10% 70%, rgba(60,60,90,0.12) 0%, transparent 60%),
      #080808;
  }

  .shimmer-line {
    position: absolute;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(212,170,100,0.25), transparent);
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0; transform: scaleY(0.8); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  .fade-up {
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .search-wrap {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
  }

  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,170,100,0.2);
    border-radius: 4px;
    padding: 18px 130px 18px 24px;
    font-family: 'Raleway', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: #e8e4de;
    letter-spacing: 0.03em;
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    caret-color: #d4aa64;
  }

  .search-input::placeholder {
    color: rgba(232,228,222,0.3);
    letter-spacing: 0.04em;
  }

  .search-input:focus {
    border-color: rgba(212,170,100,0.55);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 0 3px rgba(212,170,100,0.07), inset 0 0 30px rgba(212,170,100,0.03);
  }

  .search-input:focus::placeholder { opacity: 0.5; }

  .search-btn {
    position: absolute;
    right: 6px; top: 50%; transform: translateY(-50%);
    background: rgba(212,170,100,0.12);
    border: 1px solid rgba(212,170,100,0.35);
    border-radius: 3px;
    padding: 10px 20px;
    font-family: 'Raleway', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #d4aa64;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  .search-btn:hover {
    background: rgba(212,170,100,0.2);
    border-color: rgba(212,170,100,0.6);
    color: #e8c97a;
    box-shadow: 0 0 20px rgba(212,170,100,0.12);
  }

  .search-btn:active { transform: translateY(-50%) scale(0.97); }

  .pill {
    display: inline-block;
    border: 1px solid rgba(232,228,222,0.12);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: rgba(232,228,222,0.45);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .pill:hover {
    border-color: rgba(212,170,100,0.35);
    color: rgba(212,170,100,0.8);
    background: rgba(212,170,100,0.05);
  }

  .movie-card {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 2/3;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    background: #111;
  }

  .movie-card:hover {
    transform: scale(1.04) translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }

  .movie-card .poster {
    width: 100%; height: 100%;
    display: flex; align-items: flex-end;
    background-size: cover; background-position: center;
    position: relative;
  }

  .movie-card .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
  }

  .movie-card .info {
    position: relative; z-index: 1; padding: 14px;
    width: 100%;
  }

  .movie-card .title {
    font-family: 'Montserrat', serif;
    font-size: 13px; font-weight: 400;
    line-height: 1.3; color: #e8e4de;
  }

  .movie-card .meta {
    font-size: 11px; color: rgba(232,228,222,0.45);
    margin-top: 3px; letter-spacing: 0.04em;
  }

  .movie-card .rating {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(212,170,100,0.3);
    border-radius: 3px; padding: 2px 7px;
    font-size: 11px; color: #d4aa64; font-weight: 500;
  }

  nav { position: relative; z-index: 10; }

  .logo {
    font-family: 'Montserrat', serif;
    font-size: 22px; font-weight: 300; letter-spacing: 0.2em;
    color: #d4aa64; text-transform: uppercase;
  }

  .nav-link {
    font-size: 12px; letter-spacing: 0.1em; font-weight: 300;
    color: rgba(232,228,222,0.45);
    text-decoration: none; text-transform: uppercase;
    transition: color 0.2s ease; cursor: pointer;
  }
  .nav-link:hover { color: rgba(232,228,222,0.85); }

  .section-label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(212,170,100,0.6); font-weight: 400;
  }

  .divider {
    width: 1px; height: 12px;
    background: rgba(232,228,222,0.15);
    display: inline-block;
  }

  /* Results grid */
  #results-section { display: none; }
  #results-section.visible { display: block; }

  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.4s infinite;
    border-radius: 6px;
    aspect-ratio: 2/3;
  }

  @keyframes skeletonShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .no-poster {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1a1610 0%, #2a2010 100%);
    font-size: 32px; opacity: 0.3;
  }

  .error-msg {
    text-align: center; padding: 40px;
    color: rgba(232,228,222,0.35);
    font-size: 14px; letter-spacing: 0.05em;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: #0f0f0f;
    border: 1px solid rgba(212,170,100,0.15);
    border-radius: 10px;
    max-width: 640px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-poster {
    width: 120px; height: 180px;
    object-fit: cover; border-radius: 6px;
    flex-shrink: 0;
  }

  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: rgba(232,228,222,0.6);
    font-size: 16px; transition: all 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.12); color: #e8e4de; }

  .badge {
    display: inline-block;
    border: 1px solid rgba(212,170,100,0.3);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 11px; color: #d4aa64;
    letter-spacing: 0.06em;
    font-family: 'Raleway', sans-serif;
  }

  .watch-movie-btn{
    background: rgba(212, 170, 100, 0.12);
    border: 1px solid rgba(212, 170, 100, 0.35);
    border-radius: 3px;
    padding: 10px 20px;
    font-family: 'Raleway', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #d4aa64;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  hr{
    border: none;
    border-bottom: 1px solid #d4aa640f;
    width: 100%;
    height: 1px;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(212,170,100,0.2); border-radius: 2px; }
</style>
</head>
<body>
<div class="grain"></div>

<div style="position: relative; min-height: 100vh;">
  <div class="hero-bg"></div>

  <div class="shimmer-line" style="left: 20%; height: 45vh; top: 0; animation-delay: 0s;"></div>
  <div class="shimmer-line" style="left: 55%; height: 30vh; top: 10vh; animation-delay: 1.5s;"></div>
  <div class="shimmer-line" style="left: 78%; height: 55vh; top: 5vh; animation-delay: 0.8s;"></div>

  <!-- NAV -->
  <nav class="flex items-center justify-between px-10 py-7 fade-up" style="animation-delay:0.05s">
    <div class="logo">Amadeus;Movies</div>
    <div class="flex items-center gap-8 opacity-25">
      <span class="nav-link">Coming Soon</span>
      <div class="divider"></div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="relative z-10 flex flex-col items-center text-center px-6 pt-16 pb-10">

    <div class="fade-up" style="animation-delay:0.15s">
      <p class="section-label mb-5">Movie/Series should be available on imdb</p>
    </div>

    <div class="fade-up display-font" style="animation-delay:0.25s; font-size: clamp(52px, 4vw, 96px); font-weight: 300; line-height: 1.05; letter-spacing: -0.01em; max-width: 820px; color: #e8e4de;">
      Watch what
      <span style="color: #d4aa64; font-style: italic;">you like.</span>
    </div>

    <p class="fade-up" style="animation-delay:0.38s; font-size: 15px; font-weight: 300; color: rgba(232,228,222,0.45); letter-spacing: 0.04em; max-width: 400px; line-height: 1.8; margin-top: 20px;">
      Just search and enjoy movies in 720p and 360p
    </p>

    <!-- SEARCH -->
    <div class="search-wrap w-full fade-up" style="animation-delay:0.5s; margin-top: 44px;">
      <input
        class="search-input"
        type="text"
        placeholder="Search movies, animes, series…"
        id="searchInput"
      />
      <button class="search-btn" id="searchBtn" onclick="handleSearch()">Search</button>
    </div>

    <!-- quick pills -->
    <div class="fade-up flex flex-wrap justify-center gap-2 mt-5" style="animation-delay:0.62s">
      <span class="pill" onclick="setSearch('Steins;Gate')">Steins;Gate</span>
      <span class="pill" onclick="setSearch('Interstellar')">Interstellar</span>
      <span class="pill" onclick="setSearch('Dune')">Dune</span>
      <span class="pill" onclick="setSearch('The Batman')">The Batman</span>
      <span class="pill" onclick="setSearch('Oppenheimer')">Oppenheimer</span>
      <span class="pill" onclick="setSearch('Parasite')">Parasite</span>
    </div>

    <!-- stats strip -->
    <div class="fade-up flex items-center gap-8 mt-12" style="animation-delay:0.72s">
      <div class="text-center">
        <div class="display-font" style="font-size:26px; font-weight:300; color:#d4aa64;">10K+</div>
        <div style="font-size:11px; letter-spacing:0.1em; color:rgba(232,228,222,0.35); text-transform:uppercase; margin-top:2px;">Titles</div>
      </div>
      <div class="divider" style="height:30px;"></div>
      <div class="text-center">
        <div class="display-font" style="font-size:26px; font-weight:300; color:#d4aa64;">87</div>
        <div style="font-size:11px; letter-spacing:0.1em; color:rgba(232,228,222,0.35); text-transform:uppercase; margin-top:2px;">Countries</div>
      </div>
      <div class="divider" style="height:30px;"></div>
      <div class="text-center">
        <div class="display-font" style="font-size:26px; font-weight:300; color:#d4aa64;"><i> Some</i> ads</div>
        <div style="font-size:11px; letter-spacing:0.1em; color:rgba(232,228,222,0.35); text-transform:uppercase; margin-top:2px;">Yep - only on viewer</div>
      </div>
    </div>
  </div>

  <!-- RESULTS SECTION -->
  <div id="results-section" class="relative z-10 px-10 pb-20 mt-4">
    <div class="flex items-center justify-between mb-6">
      <p class="section-label" id="results-label">Search Results</p>
      <span id="results-count" style="font-size:12px; color:rgba(232,228,222,0.3); letter-spacing:0.06em;"></span>
    </div>
    <div id="results-grid" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <div style="position:relative; padding: 28px;">
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<script>
const API_KEY = 'ca776892';
const API_BASE = 'https://www.omdbapi.com/';

let searchTimeout = null;

function setSearch(val) {
  document.getElementById('searchInput').value = val;
  document.getElementById('searchInput').focus();
  handleSearch();
}

async function handleSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { document.getElementById('searchInput').focus(); return; }

  const btn = document.getElementById('searchBtn');
  btn.textContent = 'Searching…';
  btn.style.opacity = '0.6';
  btn.disabled = true;

  showSkeletons();

  try {
    const res = await fetch(`${API_BASE}?apikey=${API_KEY}&s=${encodeURIComponent(query)}`);
    const data = await res.json();

    btn.textContent = 'Search';
    btn.style.opacity = '1';
    btn.disabled = false;

    if (data.Response === 'True') {
      renderResults(data.Search, query, data.totalResults);
    } else {
      showError(data.Error || 'No results found.');
    }
  } catch (err) {
    btn.textContent = 'Search';
    btn.style.opacity = '1';
    btn.disabled = false;
    showError('Connection error. Please try again.');
  }
}

function showSkeletons() {
  const section = document.getElementById('results-section');
  const grid = document.getElementById('results-grid');
  section.classList.add('visible');
  document.getElementById('results-label').textContent = 'Searching…';
  document.getElementById('results-count').textContent = '';
  grid.innerHTML = Array(8).fill('<div class="skeleton"></div>').join('');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showError(msg) {
  const grid = document.getElementById('results-grid');
  document.getElementById('results-label').textContent = 'Results';
  grid.innerHTML = `<div class="error-msg" style="grid-column:1/-1">${msg}</div>`;
}

function renderResults(movies, query, total) {
  const grid = document.getElementById('results-grid');
  document.getElementById('results-label').textContent = `Results for "${query}"`;
  document.getElementById('results-count').textContent = `${total} found`;

  grid.innerHTML = movies.map(m => {
    const hasPoster = m.Poster && m.Poster !== 'N/A';
    return `
      <div class="movie-card" onclick="openModal('${m.imdbID}')">
        <div class="poster" style="${hasPoster ? `background-image:url('${m.Poster}')` : ''}; background-size:cover; background-position:center;">
          ${!hasPoster ? `<div class="no-poster">🎬</div>` : ''}
          <div class="overlay"></div>
          <div class="info">
            <div class="title">${m.Title}</div>
            <div class="meta">${m.Year} · ${m.Type === 'series' ? 'Series' : 'Film'}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function openModal(imdbID) {
  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');

  body.innerHTML = `
    <div style="display:flex; gap:20px; align-items:flex-start;">
      <div class="skeleton" style="width:120px; height:180px; border-radius:6px; flex-shrink:0;"></div>
      <div style="flex:1;">
        <div class="skeleton" style="height:28px; width:70%; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:14px; width:40%; margin-bottom:20px;"></div>
        <div class="skeleton" style="height:60px; width:100%;"></div>
      </div>
    </div>
  `;
  overlay.classList.add('open');

  try {
    const res = await fetch(`${API_BASE}?apikey=${API_KEY}&i=${imdbID}&plot=full`);
    const m = await res.json();
    console.log(m.Type)

    const hasPoster = m.Poster && m.Poster !== 'N/A';
    const rating = m.imdbRating !== 'N/A' ? m.imdbRating : null;

    body.innerHTML = `
      <div style="display:flex; flex-direction:column;gap:20px; align-items:flex-start; flex-wrap:wrap;">
      
        ${hasPoster
          ? `<img src="${m.Poster}" class="modal-poster" alt="${m.Title}" />      `
          : `<div style="width:120px; height:180px; background:rgba(255,255,255,0.04); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:36px; opacity:0.3; flex-shrink:0;">🎬</div>`
        }
            <a href="/amadeus-movies/watch-movie.html?id=${m.imdbID}&t=${m.Type}" target="_blank">
            <button class="watch-movie-btn" >WATCH Movie</button>
            </a>
            <hr>
        <div style="flex:1; min-width:200px;">
          <h2 class="display-font" style="font-size:22px; font-weight:300; color:#e8e4de; line-height:1.2; margin-bottom:8px; padding-right:40px;">${m.Title}</h2>
          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; align-items:center;">
            <span class="badge">${m.Year}</span>
            ${m.Runtime !== 'N/A' ? `<span class="badge">${m.Runtime}</span>` : ''}
            ${m.Rated !== 'N/A' ? `<span class="badge">${m.Rated}</span>` : ''}
            ${rating ? `<span class="badge" style="color:#d4aa64;">★ ${rating}</span>` : ''}
          </div>
          ${m.Genre !== 'N/A' ? `<p style="font-size:11px; letter-spacing:0.08em; color:rgba(212,170,100,0.55); text-transform:uppercase; margin-bottom:12px;">${m.Genre}</p>` : ''}
          ${m.Director !== 'N/A' ? `<p style="font-size:12px; color:rgba(232,228,222,0.4); margin-bottom:4px;">Dir. <span style="color:rgba(232,228,222,0.7);">${m.Director}</span></p>` : ''}
          ${m.Actors !== 'N/A' ? `<p style="font-size:12px; color:rgba(232,228,222,0.4); margin-bottom:16px;">${m.Actors}</p>` : ''}
          ${m.Plot !== 'N/A' ? `<p style="font-size:13px; font-weight:300; line-height:1.75; color:rgba(232,228,222,0.55);">${m.Plot}</p>  ` : ''}
          ${m.Awards && m.Awards !== 'N/A' ? `<p style="font-size:11px; color:rgba(212,170,100,0.5); margin-top:14px; letter-spacing:0.04em;">🏆 ${m.Awards}</p>` : ''}
            
          
        </div>

      </div>
    `;
  } catch {
    body.innerHTML = `<div class="error-msg">Could not load details.</div>`;
  }
}


 

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleSearch();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModalDirect();
});
</script>
</body>
</html>
